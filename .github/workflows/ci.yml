name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI runs entirely against fixture providers. No credential is required and
  # no external write is possible.
  DEMO_MODE: 'true'
  EXTERNAL_WRITES_ENABLED: 'false'
  META_MUTATIONS_ENABLED: 'false'
  META_CAPI_ENABLED: 'false'
  HUBSPOT_WRITES_ENABLED: 'false'
  APP_ENVIRONMENT: 'test'
  AUTH_ALLOWLIST: '@am-beratung.de'
  REDIRECT_ALLOWLIST: 'am-beratung.de,go.am-beratung.de,localhost'
  TRACKING_SIGNING_SECRET: 'ci-tracking-secret-value-at-least-32-chars'
  APP_ENCRYPTION_KEY: 'Y2ktZW5jcnlwdGlvbi1rZXktMzItYnl0ZXMtbG9uZyE='
  CRON_SECRET: 'ci-cron-secret'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit and integration tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build apps
        run: pnpm run build

      - name: E2E
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
